<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우주라이크 미니게임 - 얼음 깨기</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/variable/pretendardvariable.css" />
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Jua&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #00d2ff;
            --text-dark: #0747a6; 
            --title-font: 'Do Hyeon', sans-serif;
            --point-font: 'Jua', sans-serif;
            --base-font: 'Pretendard Variable', sans-serif;
            --glass-bg: rgba(255, 255, 255, 0.3);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            background: linear-gradient(180deg, #b3e5fc 0%, #81d4fa 100%);
            min-height: 100vh; display: flex; justify-content: center;
            overflow: hidden; font-family: var(--base-font); touch-action: none;
        }

        .app-container {
            position: relative; width: 100%; max-width: 480px; height: 100vh;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 15px; overflow-y: auto;
        }
        .app-container::-webkit-scrollbar { display: none; }

        .glass-panel {
            background: var(--glass-bg); border: 2px solid var(--glass-border);
            border-radius: 30px; padding: 30px 20px; text-align: center;
            box-shadow: 0 10px 25px rgba(0, 162, 255, 0.1); width: 100%; max-width: 400px;
        }

        h1 { font-family: var(--title-font); font-weight: normal; color: var(--text-dark); margin-bottom: 5px; font-size: 2.8rem; text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.8); }
        .subtitle { font-family: var(--point-font); color: #0284c7; font-size: 1.4rem; margin-bottom: 20px; }

        .btn { font-family: var(--point-font); font-weight: normal; font-size: 1.3rem; letter-spacing: 1px; padding: 12px 24px; border-radius: 20px; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.1s; margin: 5px; width: 140px; }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: #0369a1; color: white; }
        .btn-secondary { background: white; color: #0369a1; }

        .instruction-box { background: rgba(255, 255, 255, 0.8); border-radius: 20px; padding: 25px 20px; margin-bottom: 25px; text-align: left; }
        .start-desc { font-family: var(--point-font); color: #000000; font-size: 0.95rem; line-height: 1.6; word-break: keep-all; font-weight: normal; margin: 0 0 28px 0; text-align: left; letter-spacing: -0.5px; white-space: nowrap; }
        .highlight { color: #0369a1; }

        .coupon-cards { display: flex; flex-direction: column; gap: 8px; }
        .coupon-card { display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%); border-radius: 16px; padding: 10px 14px; box-shadow: 0 3px 8px rgba(0, 162, 255, 0.12); }
        .coupon-card .card-badge { background: #0369a1; color: white; font-family: var(--point-font); font-size: 0.82rem; padding: 5px 13px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; box-shadow: 0 2px 5px rgba(3, 105, 161, 0.25); }
        .coupon-card .card-text { font-family: var(--point-font); font-size: 0.88rem; color: #0c4a6e; word-break: keep-all; }
        .coupon-card .card-text mark.hl { background: linear-gradient(transparent 50%, #fde68a 50%); color: inherit; padding: 0 2px; }

        #intro-screen, #game-screen, #result-screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        #intro-screen.active, #game-screen.active, #result-screen.active { display: flex; }
        #game-screen { justify-content: flex-start; padding-top: 10px; }
        /* ★ result-screen은 콘텐츠가 화면보다 길 수 있으므로 위에서부터 정렬 + 자연 스크롤 */
        #result-screen.active { justify-content: flex-start; height: auto; min-height: 100%; padding: 16px 0 24px; }

        .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; flex-shrink: 0; }
        .back-btn { font-family: var(--point-font); background: var(--glass-bg); border: 2px solid var(--glass-border); color: var(--text-dark); padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(0, 162, 255, 0.1); cursor: pointer; display: flex; align-items: center; }

        .status-bar { width: 100%; display: flex; justify-content: center; align-items: center; margin-bottom: 30px; }
        .status-value { font-family: var(--point-font); font-size: 1.8rem; color: var(--text-dark); }
        #timer { color: #e11d48; font-size: 2rem; }

        .game-stage { position: relative; flex: 1; display: flex; justify-content: center; align-items: center; width: 100%; min-height: 350px; }

        .coupon-wrapper { position: absolute; width: 280px; z-index: 1; opacity: 0; transform: scale(0.8); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; }
        .coupon-wrapper img { width: 100%; height: auto; object-fit: contain; }
        .coupon-wrapper.revealed { opacity: 1; transform: scale(1.18); }
        .coupon-wrapper.revealed img { animation: floatingCoupon 2s ease-in-out infinite alternate; }

        @keyframes floatingCoupon { 0% { transform: translateY(0px); } 100% { transform: translateY(-15px); } }

        .ice-block { position: absolute; width: 280px; height: 280px; background-image: url('얼음깨기 아이콘/얼음1.png'); background-size: contain; background-position: center; background-repeat: no-repeat; z-index: 5; cursor: pointer; }
        .hit-shake { animation: iceShake 0.1s ease-in-out; }
        @keyframes iceShake { 0% { transform: rotate(0deg); } 25% { transform: rotate(-5deg) translateX(-6px); } 75% { transform: rotate(5deg) translateX(6px); } 100% { transform: rotate(0deg); } }
        .mini-shard { position: absolute; border: 1px solid rgba(255, 255, 255, 0.5); pointer-events: none; z-index: 6; border-radius: 2px; }

        .progress-container { width: 100%; max-width: 400px; background: rgba(255, 255, 255, 0.8); border: 2px solid var(--glass-border); border-radius: 20px; padding: 16px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); z-index: 10; }
        .progress-msg { font-family: var(--point-font); font-size: 1.05rem; color: #0369a1; text-align: center; margin-bottom: 12px; transition: color 0.3s ease; }
        .progress-label { font-family: var(--point-font); font-size: 1rem; color: var(--text-dark); margin-bottom: 8px; display: flex; justify-content: space-between; }
        .progress-bar-bg { width: 100%; height: 16px; background: rgba(0, 0, 0, 0.1); border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00d2ff 0%, #0369a1 100%); border-radius: 10px; transition: width 0.1s linear; }
        .progress-bar-fill.complete { background: linear-gradient(90deg, #4ade80 0%, #16a34a 100%); }
        .progress-label.complete { color: #16a34a; }

        .info-box { background: #ffffff; border-radius: 20px; padding: 20px; margin-bottom: 20px; text-align: left; }
        #fireworks { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
    </style>
</head>
<body>

    <canvas id="fireworks"></canvas>

    <div class="app-container">
        
        <div id="intro-screen" class="active">
            <div class="glass-panel">
                <h1>얼음 깨기</h1>
                <p class="subtitle">얼음 속 숨겨진 쿠폰 찾기!</p>
                <div class="instruction-box">
                    <p class="start-desc">제한 시간 60초 안에 화면을 빠르게 연타하여<br>단단한 얼음을 깨부수세요!</p>
                    <div class="coupon-cards">
                        <div class="coupon-card">
                            <span class="card-badge">클리어 조건</span>
                            <span class="card-text"><mark class="hl">얼음을 모두 깨기</mark></span>
                        </div>
                        <div class="coupon-card">
                            <span class="card-badge">리워드</span>
                            <span class="card-text"><mark class="hl">우주라이크 1종 쿠폰</mark></span>
                        </div>
                        <div class="coupon-card">
                            <span class="card-badge">난이도</span>
                            <span class="card-text">하</span>
                        </div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button class="btn btn-secondary" onclick="location.href='index.html'">메인으로</button>
                    <button class="btn btn-primary" onclick="startGame()">플레이</button>
                </div>
            </div>
        </div>

        <div id="game-screen">
            <div class="top-bar"><a href="index.html" class="back-btn">◀ 뒤로</a></div>
            <div class="status-bar"><span class="status-value">⏳ 남은 시간 <span id="timer">60</span>초</span></div>

            <div class="game-stage" id="stage">
                <div class="coupon-wrapper" id="coupon"><img src="얼음깨기 아이콘/쿠폰발급.png" alt="우주라이크 썸머 쿠폰"></div>
                <div class="ice-block" id="iceBlock"></div>
            </div>

            <div class="progress-container">
                <div class="progress-msg" id="progress-msg">아직 얼음이 단단해요.. 조금 더 힘을 내봐요!</div>
                <div class="progress-label" id="progress-label"><span>진행도</span> <span id="progress-text">0%</span></div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
            </div>
        </div>

        <div id="result-screen">
            <div class="glass-panel" style="margin: 20px 0;">
                <div style="font-size: 3.5rem; margin-bottom: 5px;" id="resultIcon">💥</div>
                <h2 id="result-heading">게임 오버!</h2>
                
                <div class="info-box" style="text-align: center; margin-bottom: 12px;" id="scoreDisplayWrap">
                    <p style="margin-bottom: 0; white-space: normal; font-size: 1.1rem; text-align: center;">기록: <span id="finalScore" style="color: #0369a1; font-weight: bold; font-size: 1.4rem;">0</span>초</p>
                </div>
                
                <p id="couponResultMsg" style="font-family:var(--point-font); font-size:0.95rem; word-break:keep-all; line-height:1.6; color:#0369a1; margin-bottom:12px;"></p>
                
                <div id="couponCodeBox" style="display:none; background:#f0f9ff; border:2.5px dashed #0369a1; border-radius:20px; padding:18px 16px; margin:4px 0 16px;">
                    <p style="font-family:var(--base-font); font-size:0.9rem; color:#475569; margin-bottom:8px;">쿠폰 번호 (마이페이지 등록)</p>
                    <h3 id="couponCodeText" style="font-family:var(--point-font); font-size:2rem; color:#0369a1; letter-spacing:3px; margin-bottom:14px;">XXXX-XXXX</h3>
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <button onclick="copyCoupon()" style="display:flex;align-items:center;justify-content:center;width:100%;padding:10px 0;border-radius:14px;border:none;cursor:pointer;font-family:var(--point-font);font-size:0.85rem;background:transparent;color:#0369a1;text-decoration:underline;text-underline-offset:3px;">쿠폰 번호 복사하기</button>
                        <button onclick="goToApp()" style="display:flex;align-items:center;justify-content:center;width:100%;padding:10px 0;border-radius:14px;border:none;cursor:pointer;font-family:var(--point-font);font-size:0.85rem;background:#0284c7;color:#fff;">우주라이크 앱 바로 가기</button>
                    </div>
                </div>

                <div id="rank-register-box" style="background:rgba(255,255,255,0.5); border:2px dashed #0369a1; border-radius:18px; padding:14px; margin-bottom:14px; display: none;">
                    <p style="font-family:var(--point-font); color:#0369a1; font-size:1rem; margin-bottom:10px;">🏆 랭킹에 등록하기</p>
                    <input id="rank-nickname" type="text" maxlength="8" placeholder="닉네임 (최대 8자)"
                        style="width:100%; padding:10px 14px; border:none; border-radius:12px; font-family:var(--point-font); font-size:1rem; text-align:center; background:#fff; color:#0369a1; margin-bottom:10px; outline:none;">
                    <button id="rank-submit-btn" style="width:100%; padding:12px 0; border:none; border-radius:14px; font-family:var(--point-font); font-size:1rem; background:#0284c7; color:#fff; cursor:pointer;">등록하기</button>
                    <p id="rank-status" style="font-family:var(--point-font); font-size:0.85rem; color:#0369a1; margin-top:8px; min-height:1em;"></p>
                </div>

                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button class="btn btn-secondary" onclick="location.href='index.html'">메인화면</button>
                    <button class="btn btn-primary" onclick="resetGame()">다시 하기</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const introScreen = document.getElementById('intro-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const iceBlock = document.getElementById('iceBlock');
        const coupon = document.getElementById('coupon');
        const stage = document.getElementById('stage');
        const timerDisplay = document.getElementById('timer');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const progressMsg = document.getElementById('progress-msg');
        
        const finalScoreText = document.getElementById('finalScore');
        const couponCodeBox = document.getElementById('couponCodeBox');
        const couponCodeText = document.getElementById('couponCodeText');
        const progressLabel = document.getElementById('progress-label');

        function copyCoupon() {
            const code = couponCodeText.innerText;
            navigator.clipboard.writeText(code).then(() => alert('쿠폰 번호가 복사되었습니다!'))
                .catch(() => alert('복사 실패: ' + code));
        }
        function goToApp() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            var storeUrl = isIOS
                ? 'https://apps.apple.com/kr/app/wouldulike/id6740640251'
                : 'https://play.google.com/store/apps/details?id=com.coggiri.new1';

            var fallback = setTimeout(function() {
                window.location.href = storeUrl;
            }, 1500);

            window.addEventListener('blur', function() {
                clearTimeout(fallback);
            }, { once: true });

            window.location.href = 'kakao967525b584e9c1e2a2b5253888b42c83://oauth';
        }

        const COUPON_CYCLE_START = new Date('2026-05-26T00:00:00+09:00');
        const COUPON_POOL = [
            'SF1-A4M9', // Day 01: 2026-05-26
            'SF1-B7N2', // Day 02: 2026-05-27
            'SF1-C1P6', // Day 03: 2026-05-28
            'SF1-D5Q3', // Day 04: 2026-05-29
            'SF1-E8R7', // Day 05: 2026-05-30
            'SF1-F2S4', // Day 06: 2026-05-31
            'SF1-G6T8', // Day 07: 2026-06-01
            'SF1-H3U1', // Day 08: 2026-06-02
            'SF1-I9V5', // Day 09: 2026-06-03
            'SF1-J4W2', // Day 10: 2026-06-04
            'SF1-K7X6', // Day 11: 2026-06-05
            'SF1-L1Y3', // Day 12: 2026-06-06
            'SF1-M5Z8', // Day 13: 2026-06-07
            'SF1-N2A4', // Day 14: 2026-06-08
        ];
        function getCycleCoupon() {
            const diffMs = Date.now() - COUPON_CYCLE_START.getTime();
            const dayIndex = Math.floor(diffMs / 86400000);
            return COUPON_POOL[((dayIndex % 14) + 14) % 14];
        }

        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');

        const targetClicks = 450; 
        let currentClicks = 0;
        let isGameRunning = false;
        let timeLeft = 60;
        let timerInterval;
        let finalScore = 0; // DB 저장용 점수 (높을수록 좋게)
        let startTime = 0; // 소요 시간 체크용

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function createMiniShards(x, y) {
            for (let i = 0; i < 15; i++) {
                const shard = document.createElement('div');
                shard.className = 'mini-shard';
                shard.style.background = Math.random() > 0.7 ? 'rgba(129, 212, 250, 0.8)' : 'rgba(255, 255, 255, 0.9)';
                const size = Math.random() * 8 + 4; 
                shard.style.width = `${size}px`; shard.style.height = `${size}px`;
                shard.style.left = `${x}px`; shard.style.top = `${y}px`;
                stage.appendChild(shard);

                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 200 + 80; 
                const tx = Math.cos(angle) * velocity; const ty = Math.sin(angle) * velocity;

                shard.animate([
                    { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], { duration: 600, easing: 'cubic-bezier(0.1, 0.9, 0.2, 1)' }).onfinish = () => shard.remove();
            }
        }

        let particles = [];
        let fireworkTimer;
        function createFirework() {
            const x = Math.random() * canvas.width; const y = Math.random() * canvas.height * 0.5;
            const color = `hsl(${Math.random() * 360}, 100%, 50%)`;
            for (let i = 0; i < 40; i++) { particles.push({ x, y, dx: (Math.random() - 0.5) * 10, dy: (Math.random() - 0.5) * 10, size: Math.random() * 4 + 1, color, life: 100 }); }
        }
        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.dx; p.y += p.dy; p.dy += 0.15; p.life--; 
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 100;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                if (p.life <= 0) particles.splice(i, 1);
            });
            if (particles.length > 0 || isGameRunning === false && currentClicks >= targetClicks) requestAnimationFrame(animateFireworks);
        }

        function showScreen(screen) {
            introScreen.classList.remove('active'); gameScreen.classList.remove('active'); resultScreen.classList.remove('active');
            screen.classList.add('active');
            // 결과 화면일 때 touch-action을 pan-y로 전환해 스크롤 허용
            document.body.style.touchAction = (screen === resultScreen) ? 'pan-y' : 'none';
        }
        function startGame() { showScreen(gameScreen); }

        function resetRankBox() {
            const box = document.getElementById('rank-register-box');
            const btn = document.getElementById('rank-submit-btn');
            const input = document.getElementById('rank-nickname');
            const status = document.getElementById('rank-status');
            box.style.display = 'block'; btn.disabled = false; btn.innerText = '등록하기';
            input.value = ''; input.disabled = false; status.innerText = ''; status.style.color = '#0369a1';
        }

        function endGame(isWin) {
            isGameRunning = false;
            clearInterval(timerInterval);
            
            const msg = document.getElementById('couponResultMsg');
            const icon = document.getElementById('resultIcon');
            const heading = document.getElementById('result-heading');
            
            if (isWin) {
                // 정확한 시간 계산 (밀리초)
                const timeTakenMs = Date.now() - startTime;
                const timeTakenSec = (timeTakenMs / 1000).toFixed(2);
                finalScore = 100000 - timeTakenMs; // 시간이 짧을수록 높은 점수로 DB에 저장

                iceBlock.style.display = 'none';
                coupon.classList.add('revealed');
                
                fireworkTimer = setInterval(createFirework, 300);
                animateFireworks();

                icon.innerText = "🧊";
                heading.innerText = "성공!";
                msg.innerHTML = "🎉 축하합니다!<br>얼음을 깨고 <b>우주라이크 1종 쿠폰</b>이 발급되었습니다!";
                msg.style.color = "#0369a1";
                
                finalScoreText.innerText = timeTakenSec;
                document.getElementById('scoreDisplayWrap').style.display = 'block';

                couponCodeText.innerText = getCycleCoupon();
                couponCodeBox.style.display = "block"; 
                resetRankBox();

                setTimeout(() => { clearInterval(fireworkTimer); showScreen(resultScreen); }, 3500); 
            } else {
                icon.innerText = "💥";
                heading.innerText = "시간 초과!";
                msg.innerHTML = `아쉽네요! 제한 시간이 초과되었습니다.<br>다시 도전해보세요!`;
                msg.style.color = "#475569";
                couponCodeBox.style.display = "none";
                document.getElementById('scoreDisplayWrap').style.display = "none";
                document.getElementById('rank-register-box').style.display = 'none';
                setTimeout(() => { showScreen(resultScreen); }, 1000);
            }
        }

        function resetGame() {
            currentClicks = 0; timeLeft = 60; finalScore = 0; startTime = 0;
            timerDisplay.textContent = timeLeft;
            progressFill.style.width = '0%'; progressText.textContent = '0%';
            progressFill.classList.remove('complete'); progressLabel.classList.remove('complete');
            
            progressMsg.innerText = "아직 얼음이 단단해요.. 조금 더 힘을 내봐요!"; progressMsg.style.color = "#0369a1";
            iceBlock.style.display = 'block'; iceBlock.style.backgroundImage = "url('얼음깨기 아이콘/얼음1.png')";
            coupon.classList.remove('revealed');
            
            clearInterval(fireworkTimer); particles = []; ctx.clearRect(0, 0, canvas.width, canvas.height);
            showScreen(gameScreen);
        }

        iceBlock.addEventListener('pointerdown', (e) => {
            if (timeLeft <= 0) return;
            if (!isGameRunning) {
                isGameRunning = true;
                startTime = Date.now(); // 첫 터치 시 정확한 밀리초 타이머 시작
                timerInterval = setInterval(() => {
                    timeLeft--; timerDisplay.textContent = timeLeft;
                    if (timeLeft <= 0) endGame(false);
                }, 1000);
            }

            currentClicks++;
            const rect = iceBlock.getBoundingClientRect();
            createMiniShards(e.clientX - rect.left + 140, e.clientY - rect.top + 140);

            iceBlock.classList.remove('hit-shake'); void iceBlock.offsetWidth; iceBlock.classList.add('hit-shake');

            let progressRatio = currentClicks / targetClicks;
            let progressPercent = Math.min(100, Math.floor(progressRatio * 100));
            progressFill.style.width = `${progressPercent}%`; progressText.textContent = `${progressPercent}%`;

            if (progressRatio < 0.25) { iceBlock.style.backgroundImage = "url('얼음깨기 아이콘/얼음1.png')"; progressMsg.innerText = "아직 얼음이 단단해요.. 조금 더 힘을 내봐요!"; }
            else if (progressRatio < 0.5) { iceBlock.style.backgroundImage = "url('얼음깨기 아이콘/얼음2.png')"; progressMsg.innerText = "얼음에 조금씩 금이 가기 시작했어요!"; }
            else if (progressRatio < 0.75) { iceBlock.style.backgroundImage = "url('얼음깨기 아이콘/얼음3.png')"; progressMsg.innerText = "반이나 깼어요! 손가락을 더 빠르게!"; }
            else if (progressRatio < 1.0) { iceBlock.style.backgroundImage = "url('얼음깨기 아이콘/얼음4.png')"; progressMsg.innerText = "이제 거의 다 왔어요!! 마지막 스퍼트!"; }

            if (progressPercent >= 100) {
                progressFill.classList.add('complete'); progressLabel.classList.add('complete');
                progressMsg.innerText = "와장창!! 얼음이 깨졌어요! 🎉"; progressMsg.style.color = "#16a34a";
            }

            if (currentClicks >= targetClicks) endGame(true);
        });

        document.body.addEventListener('touchmove', (e) => {
            // 결과 화면에서는 스크롤 허용
            if (resultScreen.classList.contains('active')) return;
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('rank-submit-btn');
            const input = document.getElementById('rank-nickname');
            const status = document.getElementById('rank-status');

            btn.addEventListener('click', async () => {
                const nick = input.value.trim();
                if (!nick) { status.style.color = '#dc2626'; status.innerText = '닉네임을 입력해주세요.'; return; }
                if (window.UJU_RANK && !window.UJU_RANK.isCleanNickname(nick)) { status.style.color = '#dc2626'; status.innerText = '사용할 수 없는 닉네임이에요.'; return; }
                if (!window.UJU_RANK || !window.UJU_RANK.submitScore) { status.style.color = '#dc2626'; status.innerText = '랭킹 서버에 연결할 수 없어요.'; return; }
                
                btn.disabled = true; input.disabled = true; btn.innerText = '등록 중...'; status.innerText = '';
                try {
                    await window.UJU_RANK.submitScore('icebreaking', nick, finalScore);
                    status.style.color = '#0369a1'; status.innerText = '✅ 등록 완료! 랭킹 보드에서 확인하세요.'; btn.innerText = '등록 완료';
                } catch (e) {
                    console.error(e); status.style.color = '#dc2626'; status.innerText = '등록에 실패했어요. 잠시 후 다시 시도해주세요.';
                    btn.disabled = false; input.disabled = false; btn.innerText = '등록하기';
                }
            });
        });
    </script>
    <script type="module">
        import { submitScore, isCleanNickname } from './firebase-config.js';
        window.UJU_RANK = { submitScore, isCleanNickname };
    </script>
</body>
</html>
